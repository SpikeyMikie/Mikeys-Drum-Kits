<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludwig Image Gallery</title>
  </head>
  <body>
    <!--
    ===================
        Page Title
    ===================
    -->
    <header>
      <h1>
        <sup>Mikey's</sup>
        DRUM
        <sub>Kits</sub>
      </h1>
    </header>
    <!--
    ===================
        Navigation
    ===================
    -->
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li>
          <a href="index.html#ludwig-data-table">Ludwig<br />Data Table</a>

          <a href="ludwig-gallery.html">Ludwig<br />Image Gallery</a>
        </li>
        <li><a href="index.html#contact-me">Contact Me</a></li>
      </ul>
    </nav>
    <!--
    ===================
          Gallery
    ===================
    -->
    <main>
      <table class="table-gallery">
        <caption>
          Ludwig Image Gallery
        </caption>
        <!-- Snare pics Row-->
        <tr>
          <th class="th-gallery">Snare</th>
          <td class="td-gallery">
            <img
              src="images/ludwig/snare-small.jpg"
              alt="Ludwig Snare Drum Image 1"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-gallery">
            <img
              src="images/ludwig/snare-a-small.jpg"
              alt="Ludwig Snare Drum Image 2"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-no-border"></td>
        </tr>
        <!-- TomTom pics Row-->
        <tr>
          <th class="th-gallery">TomTom</th>
          <td class="td-gallery">
            <img
              src="images/ludwig/tomtom-a-small.jpg"
              alt="Ludwig TomTom Drum Image 1"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-gallery">
            <img
              src="images/ludwig/tomtom-c-small.jpg"
              alt="Ludwig TomTom Drum Image 2"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-no-border"></td>
        </tr>
        <!-- Floor Tom pics Row-->
        <tr>
          <th class="th-gallery">Floor Tom</th>
          <td class="td-gallery">
            <img
              src="images/ludwig/floortom-a-small.jpg"
              alt="Ludwig Floor Tom Drum Image 1"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-gallery">
            <img
              src="images/ludwig/floortom-b-small.jpg"
              alt="Ludwig Floor Tom Drum Image 2"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-no-border"></td>
        </tr>
        <!-- Kick pics Row-->
        <tr>
          <th class="th-gallery">Kick</th>
          <td class="td-gallery">
            <img
              src="images/ludwig/kick-small.jpg"
              alt="Ludwig Kick Drum Image 1"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-gallery">
            <img
              src="images/ludwig/kick-c-small.jpg"
              alt="Ludwig Kick Drum Image 2"
              class="table-thumb-gallery"
            />
          </td>
          <td class="td-gallery">
            <img
              src="images/ludwig/kick-b-small.jpg"
              alt="Ludwig Kick Drum Image 3"
              class="table-thumb-gallery"
            />
          </td>
        </tr>
      </table>
    </main>
  </body>
</html>
